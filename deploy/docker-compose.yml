# DranzoRMM local development stack.
#
#   cp .env.example .env            # then edit the bootstrap admin password
#   docker compose -f deploy/docker-compose.yml --env-file .env up --build
#
# Dashboard: http://localhost:8081   (first sign-in asks you to enroll an authenticator app)
# Agent gateway: https://localhost:8443 (mTLS, private CA)
#
# Optional profiles:
#   --profile agent   a Linux test agent (needs DRANZO_ENROLL_TOKEN from the Enrollment page)
#   --profile mesh    MeshCentral for remote desktop
#
# Development only: plain HTTP on localhost, default MinIO credentials, keys in a Docker volume.
name: dranzormm

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dranzo
      POSTGRES_USER: dranzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dranzo -d dranzo"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dranzo-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-minio-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ../server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=dranzo;Username=dranzo;Password=${POSTGRES_PASSWORD:-dev-only-postgres}
      Dranzo__AgentHostnames__0: localhost
      Dranzo__AgentHostnames__1: server
      Dranzo__AgentHostnames__2: 127.0.0.1
      Dranzo__PublicAgentUrl: ${DRANZO_PUBLIC_AGENT_URL:-https://localhost:8443}
      Dranzo__PublicDashboardUrl: http://localhost:8081
      Dranzo__TrustForwardedHeaders: "true"
      Dranzo__ExportTrustDirectory: /data/trust
      Dranzo__Storage__Type: s3
      Dranzo__Storage__S3ServiceUrl: http://minio:9000
      Dranzo__Storage__S3AccessKey: ${MINIO_ROOT_USER:-dranzo-dev}
      Dranzo__Storage__S3SecretKey: ${MINIO_ROOT_PASSWORD:-dev-only-minio-secret}
      Dranzo__Storage__Bucket: dranzo
      Dranzo__Bootstrap__PartnerName: ${DRANZO_PARTNER_NAME:-My IT Company}
      Dranzo__Bootstrap__AdminEmail: ${DRANZO_ADMIN_EMAIL:-admin@example.test}
      Dranzo__Bootstrap__AdminPassword: ${DRANZO_ADMIN_PASSWORD:?set DRANZO_ADMIN_PASSWORD in .env (12+ characters)}
      Dranzo__Agents__HeartbeatSeconds: ${DRANZO_HEARTBEAT_SECONDS:-60}
      Dranzo__Mesh__Url: ${MESH_URL:-}
      Dranzo__Mesh__LoginTokenKey: ${MESH_LOGIN_TOKEN_KEY:-}
    volumes:
      - keys:/data/keys
      - trust:/data/trust
    ports:
      - "127.0.0.1:8080:8080"
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q ok <&3'"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build:
      context: ../web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  agent:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: deploy/agent-test/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      DRANZO_SERVER_URL: https://server:8443
      DRANZO_ENROLL_TOKEN: ${DRANZO_ENROLL_TOKEN:-}
    hostname: linux-test-agent
    volumes:
      - trust:/trust:ro
      - agentdata:/var/lib/dranzormm

  meshcentral:
    profiles: ["mesh"]
    image: ghcr.io/ylianst/meshcentral:1.1.44
    environment:
      HOSTNAME: localhost
      REVERSE_PROXY: "false"
      ALLOW_NEW_ACCOUNTS: "false"
    volumes:
      - meshdata:/opt/meshcentral/meshcentral-data
      - meshfiles:/opt/meshcentral/meshcentral-files
    ports:
      - "127.0.0.1:8086:443"

volumes:
  pgdata:
  miniodata:
  keys:
  trust:
  agentdata:
  meshdata:
  meshfiles:
