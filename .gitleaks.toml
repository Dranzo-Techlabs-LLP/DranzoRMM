# gitleaks configuration (https://github.com/gitleaks/gitleaks), used by the
# pre-commit hook (.pre-commit-config.yaml) and the CI secret-scan job.
#
# Policy: the default rule set applies everywhere. The allowlist below is
# deliberately tiny. Do NOT add a path here to silence a finding; rotate the
# secret and remove it from history instead (docs/RUNBOOK.md, "Leaked secret").

title = "DranzoRMM gitleaks config"

[extend]
useDefault = true

# --- DranzoRMM-specific rules (in addition to the defaults) -----------------

[[rules]]
id = "dranzo-enrollment-token"
description = "DranzoRMM enrollment token"
regex = '''dz_enroll_[A-Za-z0-9_-]{32,}'''
keywords = ["dz_enroll_"]

[[rules]]
id = "dranzo-api-key"
description = "DranzoRMM API key"
regex = '''dz_api_[0-9a-f]{32}_[A-Za-z0-9_-]{32,}'''
keywords = ["dz_api_"]

[[rules]]
id = "dranzo-session-token"
description = "DranzoRMM dashboard session token"
regex = '''dz_sess_[A-Za-z0-9_-]{32,}'''
keywords = ["dz_sess_"]

# --- Allowlist ---------------------------------------------------------------

[[allowlists]]
description = "Documented protocol signature test vectors (public key and signed envelopes only; the matching private seed is a throwaway generated by the server test that writes this file)"
paths = [
  '''^agent/internal/protocol/testdata/vectors\.json$''',
]

[[allowlists]]
description = "Test fixtures: throwaway keys and certificates generated for tests only"
paths = [
  '''^agent/internal/.+/testdata/.+''',
  '''^server/tests/.+/Fixtures/.+''',
  '''^web/src/test/fixtures/.+''',
]

[[allowlists]]
description = "Lock files contain integrity hashes, not secrets"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)packages\.lock\.json$''',
  '''(^|/)go\.sum$''',
]
