# DranzoRMM agent - systemd drop-in (installed as
# /usr/lib/systemd/system/dranzormm-agent.service.d/10-hardening.conf).
#
# A drop-in is used because the unit definition can come from two places (the
# packaged unit, or the one `dranzo-agent install` writes to /etc); systemd merges
# this file into whichever is active.
#
# What this agent is: a root service whose JOB is to run administrator scripts,
# install packages, apply OS updates and reboot the machine. Most systemd
# sandboxing is inherited by child processes and would break exactly that work,
# so each directive below is either safe for an RMM agent or deliberately left
# off with the reason stated. Do not add sandboxing here without testing script
# execution, apt/dnf installs, `runuser` (run-as-user jobs) and reboots.

[Unit]
# The agent only makes outbound connections; wait for the network but never
# block boot on it (Wants, not Requires).
Wants=network-online.target
After=network-online.target
# Never let systemd give up restarting: an agent that stays down is a device that
# can no longer be managed without a site visit. (This also overrides the
# StartLimitInterval=5/Burst=10 in the unit written by `dranzo-agent install`.)
StartLimitIntervalSec=0

[Service]
# --- Availability -----------------------------------------------------------
# Restart on every exit, clean or not. The agent exits non-zero on fatal errors
# and exits on purpose during self-update (docs/PROTOCOL.md 6.4).
Restart=always
# Short enough to recover quickly, long enough not to hammer the server; the
# agent has its own jittered reconnect backoff on top of this.
RestartSec=10
# The agent cancels running jobs and closes sessions on SIGTERM and waits up to
# 20 s (agent/internal/svc/svc.go); give it slightly longer before SIGKILL.
TimeoutStopSec=30

# --- Process handling -------------------------------------------------------
# Only the agent's main process is signalled on stop/restart. Reason: a patch or
# software job may upgrade the dranzo-agent package itself; the package's
# post-install script restarts this unit while apt/dnf (a child of the agent) is
# still running. With the default KillMode=control-group systemd would kill the
# package manager mid-transaction and leave dpkg/rpm in a broken state.
# Trade-off: if the agent is killed hard (SIGKILL/OOM) its children are not
# cleaned up by systemd. Remote terminal shells still end (their PTY closes);
# a detached script keeps running until it finishes.
KillMode=process

# --- Privileges -------------------------------------------------------------
# REQUIRED to stay "no": jobs run setuid/setgid helpers (runuser/su for
# run-as-user scripts, package maintainer scripts, sudo inside admin scripts).
# NoNewPrivileges=yes would silently break them. Stated explicitly so a later
# "harden everything" change does not flip it by accident.
NoNewPrivileges=no

# --- File permissions on agent secrets --------------------------------------
# systemd (re)creates these with the given mode and root ownership before every
# start, so the device private key, trust anchors and the enrolment token stay
# root-only even if a directory was chmod-ed by mistake.
#   /var/lib/dranzormm  state: device.key, device.crt, ca.pem, trust.json, config.json
#   /etc/dranzormm      bootstrap.json (server URL + enrolment token until enrolled)
StateDirectory=dranzormm
StateDirectoryMode=0700
ConfigurationDirectory=dranzormm
ConfigurationDirectoryMode=0700

# --- Logging ----------------------------------------------------------------
# The agent writes its own rotated log (/var/lib/dranzormm/agent.log, never
# tokens, keys or script bodies). Anything it prints goes to the journal too.
SyslogIdentifier=dranzormm-agent

# --- Deliberately NOT set (each would break legitimate RMM work) ------------
# ProtectSystem= / ReadOnlyPaths=   installers and patching write everywhere under /usr, /etc, /boot
# ProtectHome=                      file browser and run-as-user jobs need /home
# PrivateTmp=                       scripts exchange files with users through /tmp
# PrivateDevices= / DeviceAllow=    disk, encryption (LUKS) and hardware inventory read /dev
# ProtectKernelModules/Tunables=    policy remediation (e.g. USB storage) and updates touch them
# RestrictNamespaces=               snap, flatpak and container tooling started by jobs need namespaces
# SystemCallFilter= / seccomp       filters are inherited by every installer and script
# CapabilityBoundingSet=            root with a reduced set breaks package scripts unpredictably
# UMask=0077                        would be inherited by installers and make installed files
#                                   unreadable; the agent sets explicit modes on its own files instead
# User= / DynamicUser=              docs/SPEC.md section 2 requires root
