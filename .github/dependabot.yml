# Dependabot: version and security updates for every ecosystem in the repository.
# Grouping keeps the PR volume manageable; security updates are never grouped away
# (Dependabot raises them separately, immediately).
version: 2

updates:
  # ----- Go agent -----
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, agent]
    commit-message:
      prefix: "agent"
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # ----- .NET server (packages.lock.json is regenerated by Dependabot) -----
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, server]
    commit-message:
      prefix: "server"
      include: scope
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
        update-types: [minor, patch]
      azure-sdk:
        patterns: ["Azure.*"]
        update-types: [minor, patch]
      test-tooling:
        patterns: ["xunit*", "coverlet*", "Microsoft.NET.Test.Sdk"]

  # ----- Web dashboard -----
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, web]
    commit-message:
      prefix: "web"
      include: scope
    groups:
      react:
        patterns: ["react", "react-dom", "react-router", "@types/react*"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # ----- GitHub Actions (keeps the pinned commit SHAs and their version comments current) -----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # ----- Container base images -----
  # One entry per directory that holds (or is expected to hold) a Dockerfile or a
  # compose file. On 2026-11-11 only /web had a Dockerfile; for a directory without
  # a manifest Dependabot logs a "no Dockerfile found" error on its own page (it
  # does not affect CI). Remove the entries that stay unused once the layout settles.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"

  - package-ecosystem: docker
    directory: /agent
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"
