# pre-commit (https://pre-commit.com)
#
#   brew install pre-commit      # or: pipx install pre-commit
#   pre-commit install           # once per clone
#   pre-commit run --all-files   # on demand
#
# The secret scan is the mandatory part (docs/SPEC.md section 8). CI runs the same
# gitleaks version with the same .gitleaks.toml, so a commit that slips past a
# missing local hook is still caught before merge.
#
# Hook repositories are pinned to full commit SHAs; the tag is in the comment.
# `pre-commit autoupdate --freeze` refreshes them.

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Builds gitleaks with the local Go toolchain (already required for /agent).
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
        # Byte-exact signature vectors and test fixtures only (same list as .gitleaks.toml).
        exclude: ^(agent/internal/.+/testdata/|server/tests/.+/Fixtures/)
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
        exclude: ^(web/tsconfig.*\.json|\.vscode/)
      - id: end-of-file-fixer
        exclude: ^(agent/internal/.+/testdata/|server/src/Dranzo\.Infrastructure/Data/Migrations/)
      - id: trailing-whitespace
        exclude: ^(agent/internal/.+/testdata/|.*\.md$)
      - id: mixed-line-ending
        args: ["--fix=no"]
        exclude: \.(cmd|bat|sln)$

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid .env and key material
        entry: "Refusing to commit a secrets/key file (only .env.example is allowed)"
        language: fail
        files: (^|/)\.env(\..+)?$|\.(pfx|p12|p8|jks|keystore|key)$
        exclude: (^|/)\.env\.example$

      - id: gofmt
        name: gofmt (agent)
        language: system
        entry: sh -c 'out=$(gofmt -l "$@"); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi' --
        files: ^agent/.*\.go$

      - id: shell-syntax
        name: sh -n (installer and helper scripts)
        language: system
        entry: sh -c 'for f in "$@"; do if head -n1 "$f" | grep -q bash; then bash -n "$f" || exit 1; else sh -n "$f" || exit 1; fi; done' --
        files: ^(installers|scripts)/.*\.sh$|^installers/(linux|macos)/scripts/
        types: [file]
